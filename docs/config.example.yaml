# Auto Video Fixer -- example configuration
#
# This file documents every key in Config.DEFAULTS (src/autovideofixer/config.py) with its
# default value and an explanation. It is NOT loaded automatically -- copy the parts you want
# into your real config file:
#
# This file is also the default template for `avf config upgrade` (it is updated with every
# AVF release, so upgrading re-surfaces new options and improved comments while keeping your
# settings). A byte-identical copy ships inside the package at
# src/autovideofixer/data/config.example.yaml -- keep the two in sync (a unit test enforces it).
#
#   Linux:   ${XDG_CONFIG_HOME:-~/.config}/auto-video-fixer/config.yaml
#   macOS:   ~/Library/Application Support/auto-video-fixer/config.yaml
#   Windows: %APPDATA%\auto-video-fixer\config.yaml
#
# or point avf at a copy of this file directly with `avf --config /path/to/config.yaml ...`
# (or the AVF_CONFIG environment variable) -- note that an explicitly-given --config/AVF_CONFIG
# path MUST already exist; it is never silently created.
#
# This file is also the DEFAULT TEMPLATE for `avf config upgrade` (REQUIREMENTS.md § 6.8):
# it applies an existing user config's leaf values onto a copy of this file (comments/ordering/
# structure kept intact, `--template PATH` overrides which template is used), so upgrading to a
# new AVF release surfaces new options and improved comments while keeping your settings. A copy
# of this exact file is packaged at `src/autovideofixer/data/config.example.yaml` for that
# subcommand to load at runtime -- kept identical to this one (enforced by a unit test) and
# updated together with every release.
#
# You do not need to list every key: Config merges whatever you provide recursively on top of
# Config.DEFAULTS, so an empty/partial file is valid and any key you omit keeps its default.
#
# `avf process` cascades several further layers on top of this file at run time, none of which
# persist to disk:
#   1. Config.DEFAULTS
#   2. this file (or whatever --config/AVF_CONFIG points at instead)
#   3. each `process --preset NAME_OR_PATH` / `process --config PATH`, applied in the order the
#      flags appear on the command line, interleaved (`--preset A --config B --preset C` applies
#      A, then B, then C)
#   4. every other config-affecting CLI flag (--fps, --crf, --enable-stage, --set KEY=VALUE, etc.),
#      folded into ONE final layer applied LAST -- this always wins over any --preset/--config
#      layer, even if typed earlier on the command line
# A layer only clobbers the keys it actually specifies (recursive deep-merge) -- EXCEPT list-
# valued keys (e.g. pipeline.default_order below, or a preset's enable_stages), which a later
# layer REPLACES WHOLESALE, never merges element-by-element. See AGENTS.md's "Config cascade"
# section for the full model, including how --preset disambiguates a name vs. a file path, --set's
# YAML-scalar value parsing, and the argv-order-recovery mechanics/fallback.
#
# Examples:
#   avf process in.mp4 --preset 1080p60 --set stages.upscale.ai_model=RealESRGAN_x2plus
#   avf process in.mp4 --config extra.yaml --preset size_reduction   # preset applied AFTER extra.yaml
#   avf process in.mp4 --preset size_reduction --config extra.yaml   # extra.yaml applied AFTER preset
#
# Standing rule (see AGENTS.md): any change to a config key here MUST be reflected in
# Config.DEFAULTS in config.py, and vice versa -- keep this file and the code in sync.

general:
  # Directory for auto-generated output filenames ({stem}_enhanced{ext}). null = same
  # directory as the input file. Overridden per-run by `avf process -o DIR`.
  output_dir: null

  # Extension used for auto-generated output filenames, WITHOUT regard to the input's own
  # extension -- e.g. a .mkv input with output_container: mp4 produces a .mp4 output. Accepts
  # "mp4" or ".mp4" (leading dot optional). null/empty keeps the input's own extension instead.
  output_container: mp4

  # Directory for intermediate per-stage temp files (always written with a .mkv extension --
  # see AGENTS.md's "Pipeline Behavior"). null = next to the input file.
  temp_dir: null

  # How many jobs Pipeline.execute_all() runs concurrently via a thread pool. Each job reads/
  # writes distinct files so this is safe to raise for I/O-bound / traditional-only batches.
  # KEEP THIS AT 1 if any job in the batch uses AI stages (upscale/interpolate/denoise_video/
  # deblock with method=ai): concurrent AI jobs contend for the same GPU/VRAM and each runs FAR
  # slower than if run sequentially -- raising this for AI batches is a false economy, not a
  # speedup. Safe to raise for --no-ai / traditional-only batches on a multi-core machine.
  max_concurrent_jobs: 1

  # Default log level if not overridden by --verbose/--log-level. The automatic per-run log
  # file (see AGENTS.md) always captures DEBUG regardless of this setting.
  log_level: INFO

  # Whether Pipeline.execute_job() is allowed to overwrite an existing file at the job's
  # resolved output path. Overridden per-run by `avf process --overwrite`/`--no-overwrite`.
  overwrite: false

  # Global default for whether AI-capable stages (upscale, interpolate, denoise_video, deblock)
  # use their AI or traditional implementation:
  #   null  = auto (stage/preset decides per its own default -- e.g. deblock defaults to AI,
  #           denoise_video defaults to traditional, upscale picks AI when scaling up)
  #   true  = force AI everywhere (same as `avf process --ai`)
  #   false = force traditional everywhere, no GPU/PyTorch required (same as `--no-ai`)
  use_ai: null

  # Default AI-fallback policy: whether an AI-capable stage may silently fall back to its
  # traditional FFmpeg method when the AI path can't run (PyTorch missing, model load failure,
  # inference exception, or CUDA OOM after tiling retries are exhausted).
  #   true  (default) = fall back, log a WARNING, keep the job running with (lower-quality)
  #           traditional output.
  #   false = FAIL the stage instead, with a named cause, rather than silently downgrading.
  # Per-stage stages.<name>.ai_fallback (below) overrides this when set to true/false; leave it
  # null there to inherit this value. Overridden per-run by `avf process --ai-fallback` /
  # `--no-ai-fallback`.
  ai_fallback: true

  # --- REQUIREMENTS.md § 6.1/6.2/6.3: existing-output handling and input-probe policy ---
  # Pipeline.execute_job()'s decision path runs right after the input probe, before any stage
  # runs -- so a to-be-skipped job never pays for scene-mode preprocessing or a stage run.

  # What happens when job.output_path already exists and overwrite (above) is false:
  #   skip (default) = new first-class SKIPPED outcome, logged at INFO -- a video that's simply
  #           already done from a previous run isn't a "failure". Counted separately in the
  #           end-of-run summary; does NOT make the run exit non-zero.
  #   fail  = the old behavior exactly: FAILED + ERROR log.
  existing_output: skip

  # When an existing output is about to be SKIPPED, verify it actually satisfies the CURRENT
  # effective targets (container, resolution, framerate, video/audio codec -- see
  # core/output_check.py) before trusting it, instead of accepting any file at that path at face
  # value. Default ON: ffprobe-ing the existing file is cheap and the info is valuable (catches
  # e.g. a config/preset change since the file was produced). Bitrate is deliberately excluded
  # from the spec-check (nothing in this tool targets a bitrate).
  check_existing_target: true

  # A verified mismatch (check_existing_target found the existing file doesn't match) is SKIPPED
  # by default, with the mismatch logged loudly (WARNING) -- sub-reason "output-exists-mismatched".
  # Set true to have that one video actually reprocessed instead.
  reprocess_mismatched: false

  # What happens to the OLD mismatched file when reprocess_mismatched is true:
  #   rename (default) = the existing file is renamed (NEVER overwritten) to
  #           "<stem><mismatched_rename_suffix><N><ext>" (see below), then the new output is
  #           written at the original name.
  #   overwrite = replace the old file directly.
  existing_mismatched: rename

  # Rename pattern for a mismatched existing file being replaced (existing_mismatched: rename):
  # "<stem><suffix><N><ext>", N starting at 1, first unused name wins (a collision at N=1 rolls
  # over to N=2, etc.).
  mismatched_rename_suffix: "_mismatched-"

  # Cap on N above. null (default) = unlimited. A positive integer FAILS the job (with an
  # explicit reason) once every N up to the cap is already taken -- i.e. renaming is exhausted,
  # not "silently give up and overwrite/skip". 0 = renaming fully disabled: any mismatch in
  # rename mode then FAILS outright. This is a deliberate "never silently rename or overwrite"
  # strict posture, and is intentionally ALLOWED here (not rejected as invalid config) --
  # existing_output/existing_mismatched values are validated at startup, but this combination is
  # a legitimate strict choice, not a typo.
  mismatched_max_renames: null

  # An input ffprobe that can't analyze the file at all (corrupt/unreadable) FAILS that job by
  # default, with ffprobe's stderr surfaced in the log/error. Set true for an opt-in "scavenge"
  # batch mode: unanalyzable inputs become SKIPPED instead (sub-reason "invalid-input"), so a
  # batch with a few known-bad members still completes -- the failure is still logged either way,
  # just not fatal to the whole run.
  skip_invalid_inputs: false

  # ffprobe can emit warnings on stderr even on an otherwise-successful (rc=0) probe (see
  # core/ffmpeg_utils.probe()'s "-v error" flag). Non-empty stderr on a successful probe is
  # always surfaced as a WARNING log by default. Set true for an opt-in strict mode where that
  # also fails the job outright instead of just warning.
  fail_on_probe_warnings: false

  # --- REQUIREMENTS.md § 6.7: PII-clean log variant ---
  #
  # Which log FILE variant(s) to write: "raw" (default -- today's behavior, unredacted paths/
  # endpoints/titles), "clean" (substitutes KNOWN real values -- input/output filenames,
  # input/output/config directories, VLM/LLM endpoint hosts, embedded video titles -- with
  # per-run-consistent placeholders, e.g. "input_video_01.mkv"/"/path/to/input/"/
  # "http://vlm-endpoint" -- safe to share when asking for help), "both" (two files, see
  # log_suffix_raw/log_suffix_clean below), or "none" (no file logging at all). The CONSOLE
  # always stays raw regardless of this setting -- only file logging is affected.
  # Substitution is KNOWN-value-based, not guesswork regexes -- only values some code path
  # actually registered get replaced (see src/autovideofixer/logclean.py). Free-text PII
  # embedded in e.g. a DEBUG-logged VLM response is NOT caught -- documented out of scope
  # for v1. Stage temp filenames (/tmp/avf_*) are never registered (no PII by construction),
  # so they're always left as-is.
  #
  # IMPORTANT LIMITATION: this key is only read from THIS file (or an explicit top-level
  # `avf --config PATH`) -- a `--set general.log_type=...`/`--config`/`--preset` layer given to
  # `avf process` does NOT affect logging, because the `avf` group callback attaches log
  # handlers before `process` builds its own config cascade. Command-line users should pass
  # `avf --log-type clean process ...` instead (the CLI flag wins when both are given).
  log_type: "raw"

  # "both" mode only: suffix inserted into the log filename for the RAW file -- before the
  # extension when one exists ("run.log" -> "run-raw.log"), appended to the end for an
  # extensionless name. Empty (default) = no suffix, i.e. the raw file keeps the base name
  # exactly (a custom --log-file name or the auto-generated timestamped name).
  log_suffix_raw: ""

  # Same as log_suffix_raw but for the CLEAN file in "both" mode. If both suffixes would
  # produce IDENTICAL paths (e.g. both left empty), that's a config error at startup (clear
  # message, non-zero exit) -- never a silent overwrite of one file by the other.
  log_suffix_clean: "-clean"

gpu:
  # Whether to auto-detect GPU capability at all (informational; auto-detection itself happens
  # in ai/torch_utils.py and core/ffmpeg_utils.py regardless -- this mainly gates whether
  # detection results are trusted over an explicit preferred_device).
  auto_detect: true

  # PyTorch device preference for AI stages: auto, cpu, cuda, or metal (Apple Silicon MPS).
  # Separate from ffmpeg.hwaccel below, which governs FFmpeg's own encode/decode acceleration,
  # not PyTorch. Overridden per-run by `avf process --gpu-device`. Run `avf gpu-info` to see
  # what PyTorch actually detects on this machine.
  preferred_device: auto

  # Optional VRAM cap in GB for AI stages, if you need to leave headroom for other GPU work.
  # null = no explicit limit (PyTorch/CUDA's own allocator behavior applies).
  memory_limit_gb: null

  # Which Vulkan physical device index stages.<name>.backend: ncnn uses (upscale, interpolate).
  # Irrelevant to the torch backend, which uses preferred_device above instead. 0 = ncnn's own
  # default device -- on a multi-GPU machine this is NOT necessarily your fastest/discrete GPU
  # (an iGPU can enumerate before a passed-through dGPU). Find the right index with
  # `uv run python -c "import ncnn; [print(i, ncnn.get_gpu_info(i).device_name()) for i in range(ncnn.get_gpu_count())]"`.
  vulkan_device: 0

  # Process-wide cap on concurrent GPU AI inferences. Currently only gates scene mode's AI/RIFE
  # interpolation path (core/scenes.py's interpolate_scene_clip / ai/torch_utils.py's
  # get_gpu_inference_semaphore) -- scene mode runs up to scenes.max_workers scenes concurrently
  # in a thread pool, and without this, each thread resolving to the AI path would launch its own
  # RIFE inference and contend for VRAM instead of parallelizing. Whole-video (non-scene) runs
  # execute stages serially already, so this never gates them. 1 (default) = fully serialize GPU
  # inference across scene threads -- the safe default on a single GPU. Raise only if you know
  # your GPU has VRAM headroom for concurrent inferences. Also the single-GPU placeholder for
  # future multi-GPU inference distribution -- see docs/ROADMAP.md.
  max_concurrent_inferences: 1

ffmpeg:
  # Path to the ffmpeg binary. null = auto-detect via `shutil.which` in PATH. ffprobe is
  # located relative to this path (or also auto-detected via PATH) -- see get_ffprobe_path().
  binary: null

  # FFmpeg hardware acceleration for encode/decode: auto, cuda, vaapi, qsv, vulkan, d3d11,
  # videotoolbox, or none. "auto" probes `ffmpeg -hwaccels` and picks the first available in
  # preference order (cuda > vaapi > qsv > videotoolbox > d3d11 > vulkan). Overridden per-run by
  # `avf process --hwaccel`. Independent of gpu.preferred_device above (that's PyTorch, this is
  # FFmpeg) -- a system can have one working without the other.
  hwaccel: auto

  # FFmpeg thread count. 0 = let FFmpeg choose automatically.
  threads: 0

quality:
  # VMAF model to use for estimate_vmaf() (core/quality.py).
  vmaf_model: vmaf_v0.6.1

  # VMAF feature set passed to libvmaf.
  vmaf_features: "psnr,ssim,ms_ssim,fast"

  # Timeout (seconds) for the quality gate's whole-video VMAF/SSIM comparison ffmpeg pass
  # (core/quality.py's estimate_quality_vmaf()/estimate_ssim_psnr(), called from
  # Pipeline.execute_job()'s post-job quality gate below). This isn't a stage, so it gets its
  # own key rather than living under stages.<name>.timeout. null (default) = unlimited: same
  # reasoning as pipeline.stage_timeout below -- a fixed wall-clock cap on a whole-video
  # comparison pass is wrong-shaped for long inputs. 0 is accepted as an explicit alias for
  # null. A positive number is seconds; negative/non-numeric raises a config error when the
  # quality gate actually runs (see resolve_timeout() in config.py).
  timeout: null

  quality_target:
    # Whether/how Pipeline.execute_job()'s post-job quality gate checks output against a
    # target: none (skip the check entirely), min, avg, or max. This is a best-effort,
    # non-fatal check -- a failed/unmeasurable comparison never fails an otherwise-successful
    # job, it only records job_result.quality_score / quality_meets_target for callers to act
    # on (or leaves them as None/"not checked" if the FFmpeg comparison pass itself failed).
    mode: none

    # Target quality score (SSIM/PSNR-scale, or VMAF 0-100 depending on which estimator is
    # used) the quality gate compares against when mode != none.
    target: 95.0

    # Maximum acceptable quality loss percentage -- used by presets like size_reduction to
    # bound how much compression is allowed before the gate should flag it.
    max_loss_pct: 5.0

    # Target output resolution as [width, height], e.g. [3840, 2160]. null = no explicit
    # target (upscale stage's should_run() then reports "No target resolution specified" and
    # is skipped). Overridden per-run by `avf process --resolution WIDTHxHEIGHT`.
    target_resolution: null

    # Target output framerate, e.g. 60.0. null = no explicit target (interpolate stage is
    # skipped). Overridden per-run by `avf process --fps`.
    target_framerate: null

    # Whether upscale (and any future resolution-changing stage) preserves the original
    # video's aspect ratio when scaling toward target_resolution, rotating the target bounding
    # box to match portrait/landscape input orientation rather than stretching to an exact
    # target_resolution. See AGENTS.md's "Upscaling & Aspect Ratio" section for the algorithm.
    keep_aspect_ratio: true

    # How UpscaleStage/DownscaleStage fit an input into target_resolution's (orientation-aware)
    # box -- see core.output_check.compute_fitted_dimensions() and docs/REQUIREMENTS.md § 7.
    # "preserve_aspect" (default) keeps the input's exact aspect ratio, fits it entirely within
    # the target box, and rounds up to dimension_multiple. "snap_limiting" ("snap-to-box-when-
    # close") always lands the LIMITING axis (the one binding the aspect-preserving fit) exactly
    # on the target; the OTHER (derived) axis is ALSO snapped exactly onto its target bound
    # whenever it would otherwise fall short by no more than snap_tolerance (e.g. a 1440x812
    # input against a [1920, 1080] target snaps to a clean 1920x1080 instead of ~1920x1078) --
    # beyond that tolerance (a genuinely different aspect ratio) the derived axis is left at its
    # aspect-preserving value instead, rounded to the nearest dimension_multiple. Overridden
    # per-run by `avf process --resolution-fit-mode`.
    resolution_fit_mode: preserve_aspect

    # Output dimensions (upscale/downscale) are rounded to a multiple of this. 2 is required by
    # H.264/yuv420p (chroma subsampling needs even dimensions); raise for stricter codecs that
    # need e.g. a multiple of 4/8/16. Overridden per-run by `avf process --dimension-multiple`.
    dimension_multiple: 2

    # Only used by resolution_fit_mode: snap_limiting. Fractional tolerance (0.01 = 1%) for how
    # close the derived (non-limiting) axis must be to the target box before it's snapped
    # exactly onto it, accepting a sub-percent aspect-ratio shift for a clean standard
    # resolution. Overridden per-run by `avf process --snap-tolerance`.
    snap_tolerance: 0.01

pipeline:
  # Drives actual stage order, omission, AND repetition -- Pipeline.resolve_stage_order()
  # (called by optimize_stage_order()/execute_job()) reads this list; a hardcoded
  # DEFAULT_STAGE_ORDER fallback in core/pipeline.py only kicks in if this key is
  # missing/empty. Each entry is either:
  #
  #   1. A plain stage name string (as below) -- behaves exactly like before: this
  #      occurrence runs iff the stage is in the requested/auto-determined stage set
  #      (job.stages / preset enable_stages / auto_determine_stages()).
  #
  #   2. A mapping for explicit per-occurrence control:
  #        - stage: deblock            # required -- the registered stage name
  #          enabled: true             # optional tristate:
  #                                     #   true  = ALWAYS runs, regardless of
  #                                     #           stages.<name>.enabled, preset
  #                                     #           enable_stages, or auto-determination
  #                                     #           membership (should_run()'s own internal
  #                                     #           dependency/sanity gates still apply).
  #                                     #   false = NEVER runs -- the only way to hard-drop a
  #                                     #           stage that's otherwise requested (omitting
  #                                     #           it from this list entirely does NOT drop
  #                                     #           it -- see the compat note below).
  #                                     #   null/omitted (default) = defer to global gating,
  #                                     #           same as a plain string entry.
  #          config:                   # optional per-occurrence config overrides, deep-merged
  #            ai_model: realesr-general-x4v3   # over stages.<name> <- job.stage_overrides[name]
  #                                             # for THIS occurrence only (see BaseStage.__init__).
  #
  #   The same stage name may appear more than once -- each occurrence resolves and runs
  #   independently, in list order, each chaining off the previous occurrence's output like
  #   any other stage (occurrence-qualified labels like "deblock#2" are used internally for
  #   temp filenames/stage_results/logging when a stage repeats -- the plain name is used
  #   everywhere a stage has just one occurrence, so this is invisible in the common case).
  #
  #   Compat note: a stage in the requested/auto-determined set that ISN'T mentioned
  #   anywhere in this list (as a string or inside a mapping's `stage` key) is still
  #   appended at the end -- this is what keeps plain --stage usage working when a stage
  #   isn't in the configured order list. `encode` always stays last regardless.
  #
  # DEFAULTS itself stays plain strings (as below) so out-of-box behavior is unaffected by
  # this feature -- the mapping form is opt-in. Note crop now runs FIRST, right after detect
  # (previously it ran after stabilize): stabilize's zoom is now a real percentile-based
  # "borderless" zoom (not the old motion-guess zoom), so it no longer leaves a black border
  # for a later crop to clean up -- there's nothing left for a post-stabilize crop to do.
  # downscale sits right after crop: it's opt-in and off by default
  # (stages.downscale.enabled), and shrinks an oversized input down to the target resolution
  # box BEFORE the heavier deblock/denoise_video/upscale/interpolate stages run, so they never
  # spend compute on pixels that would just be discarded downstream anyway (and, since crop now
  # runs first, downscale and every downstream stage size off the already-cropped content). See
  # core/stages/downscale.py. deblock still runs before stabilize: blocking artifacts come from
  # the source video, so deblocking before stabilization's perspective warping keeps the
  # deblock model's input accurate and gives the stabilizer cleaner detail to track motion
  # against. deblock also now defaults to the compact, denoise-optimized
  # realesr-general-wdn-x4v3 model (see stages.deblock.ai_model below) instead of RRDB
  # RealESRGAN_x4plus -- it doubles as a denoise pass, which is why denoise_video now defaults
  # to disabled (stages.denoise_video.enabled: false below).
  default_order:
    - detect
    - crop
    - downscale
    - deblock
    - stabilize
    - denoise_video
    - upscale
    - interpolate
    - normalize_volume
    - normalize_audio
    - speed
    - hdr
    - encode

  # Example (commented out) of the mapping entry form -- forces "deblock" to run a second
  # time near the end at a different strength, regardless of stages.deblock.enabled:
  #   default_order:
  #     - detect
  #     - crop
  #     - downscale
  #     - deblock
  #     - stabilize
  #     - denoise_video
  #     - upscale
  #     - interpolate
  #     - normalize_volume
  #     - normalize_audio
  #     - speed
  #     - hdr
  #     - stage: deblock
  #       enabled: true
  #       config:
  #         strength: low
  #     - encode

  # Example (commented out) of a PER-OCCURRENCE timeout override -- gives just this one
  # "encode" occurrence 20 minutes regardless of stages.encode.timeout or the global
  # pipeline.stage_timeout above (BaseStage.__init__'s `overrides` param deep-merges this
  # `config:` mapping onto stages.encode for THIS occurrence only; stage_timeout() then
  # resolves it exactly like any other stages.<name>.timeout value):
  #   default_order:
  #     - detect
  #     - crop
  #     - downscale
  #     - deblock
  #     - stabilize
  #     - denoise_video
  #     - upscale
  #     - interpolate
  #     - normalize_volume
  #     - normalize_audio
  #     - speed
  #     - hdr
  #     - stage: encode
  #       config:
  #         timeout: 1200

  # Safety cap on how many stage OCCURRENCES a single job may run (guards against
  # pathological --stage/default_order repetition, not normal preset/auto-determined
  # pipelines -- must stay >= 12, the length of a full default run). A stage repeated via
  # default_order counts once per repetition. Exceeding this fails the job outright rather
  # than silently truncating (which could drop the always-last "encode" stage).
  max_stages: 15

  # Whether a stage that FAILS aborts the whole job (false) or is skipped, continuing the
  # pipeline with the last successfully-produced intermediate as input to the next stage
  # (true, the default -- more resilient for unattended batch runs).
  skip_stage_on_error: true

  # Default timeout (seconds) for a stage's MAIN ffmpeg processing/mux pass(es) -- see
  # BaseStage.stage_timeout() in core/stages/base.py. null (default) = unlimited. Real-world
  # long videos legitimately take longer than any fixed wall-clock cap on a whole-video pass
  # (the old hardcoded timeout=600/1800/3600 sprinkled across core/stages/*.py died with
  # "timeout reached" on inputs that were simply long, not stuck) -- a genuine hang is
  # something an external job runner/OS watchdog should notice from inactivity, not something
  # this pipeline should second-guess with an arbitrary per-run cap. Set a positive number of
  # seconds here to restore a global cap (e.g. for a batch runner that wants to bound
  # worst-case wall time per stage pass). 0 is accepted as an explicit alias for null. Negative
  # or non-numeric values raise a config error when a stage actually resolves its effective
  # timeout (BaseStage.stage_timeout() / resolve_timeout() in config.py), not eagerly at
  # config-load time. Short, genuinely-bounded helper calls within a stage (probes, hwaccel
  # detection, single-frame extraction, cropdetect quick samples, loudness measurement)
  # intentionally keep their own small fixed timeouts regardless of this key -- a hang there
  # indicates real breakage, not a long input.
  stage_timeout: null

stages:
  # Per-stage timeout override: EVERY stage accepts an optional `timeout:` key (not listed
  # explicitly on each stage below since it's absent -> inherits the global default), resolved
  # by BaseStage.stage_timeout() as:
  #   stages.<name>.timeout (this stage)  ->  pipeline.stage_timeout (global, above)  ->  null
  # Same null/0-means-unlimited, positive-number-is-seconds, negative/non-numeric-is-an-error
  # semantics as pipeline.stage_timeout at every level. See stages.deblock.timeout below for a
  # worked example, and pipeline.default_order's commented-out mapping-entry example further
  # up for the equivalent PER-OCCURRENCE form (`config: {timeout: ...}`).
  upscale:
    enabled: true
    # Real-ESRGAN checkpoint name from ai/model_cache.py's MODEL_REGISTRY. RRDB models (highest
    # quality, default): RealESRGAN_x4plus, RealESRGAN_x2plus, RealESRGAN_x4plus_anime_6B.
    # x2plus is auto-substituted for x4plus whenever a given AI pass only needs <=2x scale
    # (faster; see CHANGELOG). Compact SRVGG models (10-30x less GPU compute per frame, some
    # quality cost vs RRDB -- not auto-substituted by the x4plus->x2plus swap above):
    # realesr-general-x4v3, realesr-general-wdn-x4v3 (denoise-strength companion checkpoint,
    # blending with realesr-general-x4v3 not implemented -- usable standalone), and
    # realesr-animevideov3 (animation-tuned, smallest/fastest).
    ai_model: RealESRGAN_x4plus
    # Traditional (non-AI) method identifier; currently only "superres" (FFmpeg lanczos scale)
    # is implemented.
    traditional_method: superres
    # Scale factor per AI pass when not auto-derived from target_resolution (max 4 per Real-
    # ESRGAN pass; multi-pass chaining handles larger totals).
    scale_factor: 4
    # Test-time augmentation mode (0 = off). Higher values trade speed for quality by averaging
    # predictions over flipped/rotated variants of each frame.
    tta_mode: 0
    # Tile size in pixels for chunked GPU inference. 0 = auto: only tile when a frame's
    # resolution risks CUDA OOM (see RealESRGANUpscaler.AUTO_TILE_THRESHOLD_PX) or reactively
    # after a caught OOM. Set > 0 to always tile at that size (useful on VRAM-constrained GPUs
    # to avoid ever hitting OOM in the first place).
    tile_size: 0
    # Frames batched into one Real-ESRGAN forward pass (whole-*frame* batching -- N different
    # frames per call). 1 (default) = one frame at a time, today's behavior; opt-in until
    # field-tested. Only takes effect for frames small enough to skip tiled inference -- falls
    # back to one-frame-at-a-time whenever any frame in a chunk would need tiling (see tile_size
    # above), when tta_mode is enabled, or on the ncnn backend. On a caught CUDA OOM, the batch
    # is recursively split in half and retried, down to batch=1 (today's per-frame OOM/tiling
    # retry path, unchanged).
    batch_size: 1
    # Tiles (sharing the same padded input shape) batched into one forward pass when a frame's
    # resolution triggers tiled inference (see tile_size above). 1 (default) = one tile at a
    # time, today's behavior. This is the batching knob that matters for large frames -- e.g. a
    # 4K frame at the default tile_size=512 needs a 5x8=40-tile grid, so raising this collapses
    # many small sequential forward passes into a handful of larger ones. Independent of
    # batch_size above (different batching axis: N tiles of ONE frame, vs N whole frames) --
    # same OOM halving-retry behavior as batch_size.
    tile_batch_size: 1
    # Per-stage AI-fallback override: null = inherit general.ai_fallback above; true/false
    # overrides it for this stage only.
    ai_fallback: null
    # Per-stage AI/traditional method override: null (default) = auto -- upscale's own
    # scale-threshold logic picks AI when a real scale-up is needed, else traditional lanczos
    # scaling. true/false forces AI/traditional for this stage only, overriding the auto
    # scale-threshold logic but NOT an explicit method= kwarg from a caller. See AGENTS.md's
    # "AI/Traditional Method Selection" for the full precedence (explicit method= kwarg > this
    # key > general.use_ai > auto default).
    use_ai: null
    # Inference backend: torch (PyTorch/CUDA) or ncnn (Vulkan via the in-process `ncnn` Python
    # package -- portable to AMD/Intel/integrated GPUs, no CUDA-matched torch build needed).
    # Falls through the ai_fallback policy if the ncnn package, a Vulkan device, or the ncnn
    # model files are unavailable.
    backend: torch
    # CRF for this stage's internal temp encode (the chunked streaming write to a temp .mp4
    # before the final mux pass), NOT the final output's quality -- that's encoding.crf /
    # --crf. Default 16 (near-visually-lossless). The mux pass now stream-copies (`-c:v copy`)
    # this temp file's video track unchanged, so this IS the only encode the AI-processed
    # frames go through -- previously the temp was written at libx264's own default (CRF 23)
    # and then RE-encoded by the mux pass at CRF 18, a double lossy generation plus a wasted
    # full x264 pass. The preset is always "medium" (not configurable here).
    temp_crf: 16
    # Frame-transport backpressure knobs (ai/frame_pipe.py, backed by the Rust avf_framepipe
    # extension when built, else a pure-Python fallback). Only meaningfully vary the Rust
    # backend's bounded channels -- the Python fallback's writer queue depth is a fixed constant
    # (see ai/frame_pipe.py's "fallback parity gaps" docstring note).
    read_ahead: 2         # max decoded chunks buffered ahead of GPU inference
    write_queue_depth: 4  # max encoded chunks buffered ahead of the ffmpeg encoder pipe

  downscale:
    # Shrinks an oversized input down to the target resolution box BEFORE the heavier
    # deblock/denoise_video/upscale/interpolate stages run, so they never spend compute on
    # pixels that would just be discarded downstream anyway. Off by default -- strictly
    # opt-in (see docs/REQUIREMENTS.md § 7). Traditional/FFmpeg only, no AI path. Uses the
    # same quality.quality_target.resolution_fit_mode/dimension_multiple as upscale (via the
    # shared core.output_check.compute_fitted_dimensions()), so a downscale and a subsequent
    # upscale on the same target box always agree on dimensions. Overridden per-run by
    # `avf process --downscale`/`--no-downscale`.
    enabled: false

  interpolate:
    enabled: true
    # RIFE checkpoint name, e.g. rife_v4.6, rife_v4.11.
    ai_model: rife_v4.6
    # Traditional method: FFmpeg's minterpolate filter (motion-compensated frame blending).
    traditional_method: minterpolate
    ai_fallback: null  # see stages.upscale.ai_fallback above
    # Per-stage AI/traditional override: null (default) = auto (traditional minterpolate --
    # deliberate, fast with decent quality). true/false forces AI/traditional for this stage
    # only. See stages.upscale.use_ai above for the full precedence. Scene mode has its OWN
    # scenes.interpolate.use_ai override (see the scenes: section below) that supersedes this
    # key for the per-scene interpolation path only.
    use_ai: null
    # torch | ncnn -- see stages.upscale.backend. RIFE's ncnn backend uses a separate package,
    # rife-ncnn-vulkan-python (part of the "ncnn" extra), not the generic ncnn package upscale
    # uses -- RIFE's official graph needs a custom 'rife.Warp' ncnn layer only that package
    # registers. Verified working. Falls back per ai_fallback policy if that package, a Vulkan
    # device, or the ncnn model files are unavailable.
    backend: torch
    # minterpolate is single-threaded per ffmpeg process -- for a long enough clip, the
    # traditional path splits it into N frame-index-aligned chunks (1-frame overlap, trimmed
    # on concat) and runs them as parallel ffmpeg processes. AI/RIFE stays serial (GPU-bound).
    # 0 = auto (min(cpu_count, 8)); 1 = disable chunking (always one serial ffmpeg process).
    parallel_chunks: 0
    # Below this input duration, chunking isn't worth the per-chunk startup/concat overhead --
    # the input runs as a single (serial) chunk regardless of parallel_chunks.
    min_chunk_duration_sec: 5.0
    # See stages.upscale.temp_crf above -- only used by the AI/RIFE path's internal temp encode.
    # The AI/RIFE path's internal temp encode is Matroska (.mkv, H.264), not .mp4: MKV is written
    # incrementally, so a partial file stays playable/recoverable even if the process is killed
    # mid-write (OOM, host shutdown, power loss) -- unlike MP4, whose moov index is only written
    # at clean finalize. Stream-copyable into the final MP4 output either way.
    temp_crf: 16
    read_ahead: 2         # see stages.upscale.read_ahead above; AI/RIFE path only
    write_queue_depth: 4  # see stages.upscale.write_queue_depth above; AI/RIFE path only
    # When the AI/RIFE path is used and the target framerate isn't an exact integer multiple of
    # the source, run RIFE at the largest integer factor <= target (never overshoot) then a
    # minterpolate finish pass to reach the exact target -- instead of overshooting (e.g. 50->60
    # forced to factor 2 -> 100fps) and relying on a downstream frame-drop to get back to 60.
    # minterpolate's mi_mode=mci does true motion-compensated interpolation, so the finish pass
    # adds no jitter. false restores the pre-hybrid overshoot behavior. See AGENTS.md's "Hybrid
    # RIFE + minterpolate" section and InterpolateStage._plan_ai_interpolation().
    hybrid_ai_minterpolate: true

  denoise_video:
    # Off by default: deblock's default ai_model (realesr-general-wdn-x4v3, see stages.deblock
    # below) is trained on real-world degradation including noise, not just blocking, so its
    # one early AI pass now covers denoising too and the other default stages don't introduce
    # new noise. Stays in pipeline.default_order (omission != disable) so users who want a
    # separate denoise pass -- or who set a different, denoise-focused deblock model -- can
    # just flip this back on (or use the max_quality preset, which already does).
    enabled: false
    # Reuses the Real-ESRGAN registry (denoise runs the model at scale=1, i.e. no spatial
    # upscaling -- artifact/noise removal as a side effect of super-resolution training).
    ai_model: RealESRGAN_x4plus
    # Traditional method: FFmpeg's hqdn3d filter.
    traditional_method: hqdn3d
    tile_size: 0        # see stages.upscale.tile_size above
    batch_size: 1       # see stages.upscale.batch_size above
    tile_batch_size: 1  # see stages.upscale.tile_batch_size above
    ai_fallback: null    # see stages.upscale.ai_fallback above
    # Per-stage AI/traditional override: null (default) = auto (traditional hqdn3d -- deliberate,
    # denoising benefits less from Real-ESRGAN than deblocking does and hqdn3d needs no GPU/model).
    # true/false forces AI/traditional for this stage only. See stages.upscale.use_ai above.
    use_ai: null
    temp_crf: 16          # see stages.upscale.temp_crf above
    read_ahead: 2         # see stages.upscale.read_ahead above
    write_queue_depth: 4  # see stages.upscale.write_queue_depth above

  denoise_audio:
    # NOTE: this config block exists in Config.DEFAULTS but there is currently no registered
    # "denoise_audio" stage (see core/stages/__init__.py) -- setting enabled/ai_model/
    # traditional_method here has no effect yet. Documented as a known gap, not a working
    # feature. Kept in DEFAULTS as a placeholder for when the stage is implemented.
    enabled: true
    ai_model: demucs
    traditional_method: afftdn

  deblock:
    enabled: true
    # low, medium, high -- controls both filter amount and kernel size for the traditional
    # (unsharp-based) method.
    strength: medium
    # Compact SRVGG general-v3 checkpoint trained on real-world degradation including
    # compression/blocking artifacts AND noise -- ~3x faster than the RRDB RealESRGAN_x4plus
    # model and doubles as a denoise pass (see stages.denoise_video.enabled above). Set back to
    # RealESRGAN_x4plus for the old higher-fidelity RRDB behavior (max_quality preset does this).
    ai_model: realesr-general-wdn-x4v3
    tile_size: 0        # see stages.upscale.tile_size above
    batch_size: 1       # see stages.upscale.batch_size above
    tile_batch_size: 1  # see stages.upscale.tile_batch_size above
    ai_fallback: null    # see stages.upscale.ai_fallback above
    # Per-stage AI/traditional override: null (default) = auto (AI -- deliberate, better quality
    # than the traditional unsharp filter). true/false forces AI/traditional for this stage only.
    # See stages.upscale.use_ai above.
    use_ai: null
    temp_crf: 16          # see stages.upscale.temp_crf above
    read_ahead: 2         # see stages.upscale.read_ahead above
    write_queue_depth: 4  # see stages.upscale.write_queue_depth above
    # Example per-stage timeout override (see "stages:" intro comment above): caps THIS
    # stage's main pass/mux at 20 minutes even if pipeline.stage_timeout is unset (null) or
    # set to something else. Omitted (as on every other stage in this file) means "inherit
    # pipeline.stage_timeout".
    # timeout: 1200

  stabilize:
    enabled: true
    # Average shake magnitude (px) above which stabilization is applied; below this the stage
    # copies the input through unchanged (see should_run()/_analyze_trf_file()).
    threshold: 2.0
    # vidstabtransform smoothing window in frames -- higher = smoother camera path but more
    # lag/cropping at fast pans.
    smoothness: 40
    # Maximum pixel shift per frame vidstabtransform is allowed to apply (limits
    # overcorrection on very shaky footage).
    maxshift: 20
    # vidstabtransform optimization algorithm: opt, gauss, or avg.
    optalgo: gauss
    # vidstabdetect motion-detection sensitivity, 1-10 (higher = more sensitive to small
    # movements).
    shakiness: 10
    # Whether to let vidstabtransform apply its own optimal static zoom (optzoom=1) to hide
    # borders introduced by stabilization on very shaky footage. See AGENTS.md/CHANGELOG for
    # why this replaced an earlier hand-computed (and sign-inverted) zoom calculation.
    zoom_enabled: true
    # Minimum movement extent (px, from TRF analysis) required before zoom is applied at all --
    # below this, borders are assumed small enough to leave alone.
    zoom_threshold: 50.0
    # "black" (leave letterbox/pillarbox borders visible when zoom isn't applied) or "keep"
    # (crop mode passed to vidstabtransform's crop= option).
    zoom_mode: black
    # Whether to apply a mild unsharp pass after stabilization when stabilization was actually
    # triggered (compensates for the slight softness stabilization/zoom can introduce).
    sharpen_enabled: true
    # unsharp luma_amount used by the post-stabilize sharpen pass above. Float in [-2.0, 5.0]
    # (ffmpeg's unsharp range); higher = sharper. Validated in
    # StabilizeStage._build_sharpen_suffix() -- out-of-range values raise a clear ValueError
    # instead of a cryptic ffmpeg failure. Also settable via --sharpen-amount.
    sharpen_amount: 1.0
    # unsharp luma_msize_x/luma_msize_y (same value used for both). Odd integer in [3, 63].
    sharpen_luma_size: 3
    # unsharp chroma_amount. Float in [-2.0, 5.0]; 0.0 (default) leaves chroma untouched.
    sharpen_chroma_amount: 0.0
    # unsharp chroma_msize_x/chroma_msize_y (same value used for both). Odd integer in [3, 63].
    sharpen_chroma_size: 3
    # How much of the clip should end up border-free once zoom_enabled/zoom_threshold's gate
    # decides zoom applies at all (0.0-1.0) -- does NOT change that gate, only what zoom is used.
    # 1.0 (default) = optzoom=1, sized to the single worst frame, guaranteed no border on any
    # frame. 0.0 = no zoom at all (every border stays visible). In between = optzoom=0 plus a
    # static zoom computed from the zoom_coverage-quantile of per-frame required-zoom estimates
    # (StabilizeStage._compute_static_zoom_pct) -- trades the "no border, ever" guarantee for a
    # less aggressive crop with occasional brief borders on the most extreme motion (e.g. a
    # violent-motion ending). This is an APPROXIMATION of vidstabtransform's own smoothed camera
    # path (built from the raw TRF local-motion data, with a local moving-average matching
    # `smoothness`), not an exact read of it -- see AGENTS.md's "Stabilization zoom coverage"
    # section for the accuracy caveat and verification methodology.
    zoom_coverage: 1.0
    # Timeout (seconds) for the decode/transform pipe's whole-video wait (see execute()'s
    # decode_proc/transform_proc.wait() calls) -- a stage-specific override of the same
    # resolved timeout every other main pass in this stage uses (stages.stabilize.timeout ->
    # pipeline.stage_timeout -> null/unlimited). Explicit pipe_timeout wins when set (same
    # null/0-means-unlimited semantics as timeout above); omitted (as here) falls back to this
    # stage's own resolved stage_timeout() instead of a bespoke hardcoded default.
    # pipe_timeout: 1800

  normalize_volume:
    enabled: true
    # EBU R128 integrated loudness target in LUFS.
    target_db: -23.0
    # True peak ceiling in dBTP.
    true_peak_db: -2.0
    # Silence-skip threshold in LUFS. Inputs with no real audio track get a
    # silent stereo track added earlier in the pipeline, so by the time
    # normalize_volume/normalize_audio run there IS an audio stream -- just
    # silent (or near-silent, if the source added dithering noise). Two-pass
    # loudnorm measures measured_I = -inf on pure digital silence, which would
    # otherwise blow up the second (apply) pass with infinite gain. When the
    # measured integrated loudness is -inf/nan/unparseable OR <= this
    # threshold, the stage is skipped (input passed through unchanged, logged
    # at INFO) instead of failing. Default -80.0 dBFS sits just above what 2-3
    # LSBs of 16-bit dither can produce: 20*log10(3/32768) ~= -80.8 dBFS, so
    # genuine (if extremely quiet) 16-bit-sourced audio stays above the
    # threshold while dither-only/true silence fall at/below it. See
    # normalize_audio.py's DEFAULT_SILENCE_THRESHOLD_DB and _silence_skip_result().
    silence_threshold_db: -80.0

  # normalize_audio is the SAME loudnorm operation as normalize_volume above,
  # addressed under a separate stage name/config section for backward-
  # compatible --stage/config addressing (see NormalizeAudioStage's docstring
  # in normalize_audio.py). Not in the default preset's enable_stages (only
  # normalize_volume is, to avoid running loudnorm twice) -- opt in via
  # --stage normalize_audio or by adding it to a preset's enable_stages.
  normalize_audio:
    enabled: true
    target_db: -23.0
    true_peak_db: -2.0
    # Same silence-skip semantics as normalize_volume.silence_threshold_db above,
    # resolved independently from this stage's own config section.
    silence_threshold_db: -80.0

  hdr_to_sdr:
    enabled: false
    # Tone-mapping method; currently bt2020 is the only implemented value.
    method: bt2020

  speed:
    enabled: false
    # Playback speed multiplier (1.0 = unchanged, 2.0 = 2x faster, 0.5 = half speed).
    factor: 1.0

  # Auto-crop (opt-in, off by default). Detects a video's true content bounds -- the union
  # over the whole video, not a per-frame crop -- via FFmpeg cropdetect with reset=0, and
  # crops to that single window. Strips letterboxing/pillarboxing, including any residual
  # border stabilize can itself introduce. Runs right after "stabilize" and before every
  # other enhancement/AI stage (see AGENTS.md's "Auto-crop" section and Pipeline.
  # optimize_stage_order()). Enable via `--enable-stage crop` or `enabled: true` here/in a
  # preset. Also settable per-run via `avf process --crop-limit`.
  crop:
    enabled: false
    # cropdetect luma threshold (0-255) -- pixels darker than this are treated as "black"
    # border.
    limit: 24
    # cropdetect round= -- keeps cropped width/height even (H.264 requirement).
    round: 2
    # Skip cropping entirely if the detected crop would save fewer than this many pixels in
    # BOTH width and height -- avoids a pointless 2px crop from encoder rounding noise.
    min_crop_px: 8
    # 0 = scan the whole video. >0 = seconds to sample from the start of the video instead,
    # for very long inputs where a full scan is too slow. The real (execute()) detection
    # pass runs cropdetect with reset=1 (one crop=w:h:x:y line per analyzed frame) and
    # aggregates those per-frame windows with transition-exclusion logic instead of the old
    # reset=0 "union that can only grow" -- see aggregate_crop_windows() in
    # core/stages/crop.py and AGENTS.md's Auto-crop section. should_run()'s cheap ~10s
    # prefilter sample keeps the old single-pass reset=0 union behavior (it only decides
    # "worth attempting", not the actual crop window, so it doesn't need
    # max_outliers/aggregation precision).
    analyze_duration_sec: 0
    # cropdetect's max_outliers option (int, ffmpeg default 0): a border line may contain up
    # to N pixels above `limit` and still count as black/border. Without this, a single
    # logo/overlay sitting in the letterbox area breaks the all-pixels-black line test and
    # permanently widens the detected crop to include it. Exposed as a RATIO (not a raw
    # pixel count) because an overlay typically covers a minority of the border line it sits
    # on regardless of resolution, and a ratio scales sanely across resolutions where a fixed
    # pixel count wouldn't. Converted at detection time to max_outliers = round(
    # max_outlier_ratio * min(width, height)) -- min(w, h) rather than each scanned axis's
    # own dimension, because cropdetect applies one absolute max_outliers count to both the
    # row-scan (height-driven) and column-scan (width-driven) axes, so basing it on the
    # smaller dimension keeps the tolerance conservative on both. Range 0..0.5; 0 disables
    # (strict cropdetect behavior). Live-validated against ffmpeg: on a 1920x1080 clip with
    # 1920x800 centered content (140px black bars) and a bright ~200x60 logo drawn in the
    # bottom bar, max_outliers=0 detected crop=1920:920:0:140 (the logo widened the window);
    # with max_outliers=round(0.2*1080)=216, cropdetect correctly returned
    # crop=1920:800:0:140 (the true content box). Non-black borders are out of scope for
    # this option specifically (cropdetect is luma-only regardless of max_outliers) -- see
    # detector/border_* below for arbitrary-color border detection.
    max_outlier_ratio: 0.2
    # Transition-exclusion tuning for the per-frame aggregation that replaces the old
    # reset=0 "can only grow" union (which let a single bright full-frame transition
    # permanently widen the crop to the full frame). A run of consecutive similar per-frame
    # windows lasting <= transition_max_run_sec, with no similar window recurring within
    # transition_window_sec before/after it, is treated as a transition and excluded from
    # the final union. The same window recurring nearby (or lasting longer than
    # transition_max_run_sec even in isolation) is kept -- that's real content geometry
    # (e.g. a moving logo/letterbox change), not a transient flash.
    transition_max_run_sec: 2.0
    transition_window_sec: 4.0
    # Per-edge (left/top/right/bottom) pixel tolerance for treating two per-frame crop
    # windows as "the same" window when grouping frames into runs and comparing runs to
    # each other.
    transition_tolerance_px: 16
    # Optional VLM-assisted disambiguation: a watermark/logo sitting outside the true
    # content area can fool naive cropdetect. When true AND analysis.vlm.enabled is true,
    # one frame is rendered twice (plain + the proposed crop box drawn via drawbox) and
    # sent to the VLM with a fixed internal question. Off by default; fails open (WARNING +
    # proceed with the plain cropdetect result) on any VLM error. The original intent here
    # was for the VLM to SHRINK the detected window to exclude a non-content overlay sitting
    # in the border area; the outlier-tolerant detector above now handles that numerically,
    # so this check remains an optional safety verification layer (warn/skip policies
    # below), not the primary defense against overlays.
    vlm_check: false
    # "warn" (default): log the VLM's objection but still crop.
    # "skip": don't crop this video at all if the VLM flags content outside the box.
    # ("expand" -- growing the crop box to include the flagged region -- was considered and
    # rejected: VLMs don't return reliable pixel coordinates, so there's nothing to expand
    # to.)
    vlm_policy: warn
    # Which per-frame border detector execute() uses. cropdetect (the FFmpeg filter above)
    # is luma-threshold-only -- white/gray/colored borders and any non-dark padding are
    # invisible to it. "rust" is the avf_borders extension (rust/avf_borders/): per edge,
    # per sampled frame, it detects the DOMINANT color of the outer border strip (any
    # color, not just black) plus a "solidity" percentage, then walks inward while a
    # majority of each line still matches -- a logo/overlay occupying a minority of a
    # border line doesn't stop the walk (see border_majority below). Both signals
    # (color + consistency) are logged at INFO on every run. "auto" (default) uses "rust"
    # when the avf_borders extension is importable, else falls back to "cropdetect" (logged
    # at DEBUG). The rust detector's per-frame windows feed the SAME
    # aggregate_crop_windows() aggregation as cropdetect -- only the per-frame detection
    # step changes. See AGENTS.md's Auto-crop / "Mixed Python/Rust" sections.
    detector: auto
    # avf_borders: max per-channel absolute color difference (0-255) for two colors to
    # "match" -- used both for a border strip's solidity and for the inward line-by-line
    # walk. Rationale: a simple, fast, predictable distance metric (no sqrt/multiply) that's
    # easy to tune directly against real footage.
    border_tolerance: 24
    # avf_borders: fraction of a line's pixels that must match the border's dominant color
    # for the inward walk to continue past it. Rationale: lets a logo/overlay occupying a
    # MINORITY of a border line (e.g. a small watermark sitting in the letterbox area) pass
    # through without stopping the walk early -- the majority-color walk tolerates border
    # overlays by design. 0.80 tolerates overlays covering up to 20% of a line,
    # deliberately matching max_outlier_ratio's 0.2 default so both detectors agree.
    border_majority: 0.80
    # avf_borders: minimum fraction of an edge's outer strip that must match its own
    # dominant color for that edge to be treated as having a solid border at all (below
    # this, border_px = 0 for that edge). Rationale: the solidity gate protects blurred-
    # video-background pillarboxing (a real but non-uniform edge) from being cropped away
    # in v1 -- only a genuinely SOLID border is cropped.
    border_solidity_min: 0.60
    # avf_borders: depth (px) of the outer strip sampled per edge to compute the dominant
    # color + solidity signal, before the line-by-line inward walk begins.
    border_strip_px: 4
    # avf_borders: frames-per-second to sample at (0 = every decoded frame, matching
    # cropdetect's own reset=1 per-frame behavior modulo its default skip=2). >0 inserts an
    # ffmpeg fps= filter before detection, trading temporal resolution for speed on long
    # inputs. Unlike analyze_duration_sec above, the rust detector always scans the whole
    # input regardless of this setting -- there's no rust-side equivalent of
    # analyze_duration_sec yet.
    sample_fps: 0

# Scene-based processing (opt-in, off by default). When enabled and the job's stage list
# includes stabilize/interpolate, those two stages run per-scene (reusing existing scene
# detection -- analysis.event_detection.* above, no separate scene-mode threshold) and are
# concatenated back together before the remaining whole-video stages run. See AGENTS.md's
# "Scene mode" section for the full design. Also settable per-run via
# `avf process --scene-mode` / `--drop-non-content`.
scenes:
  enabled: false
  # Requires VLM (analysis.vlm) + a coordinating text-LLM (analysis.llm below). Drops scenes
  # the coordinator flags as not part of the main content (e.g. a "like and subscribe"
  # interstitial). Fails open (keeps every scene, logs a WARNING) on any failure -- unreachable
  # endpoint, malformed response, bad drop index -- never drops content on an LLM failure.
  # Also requires analysis.vlm.enabled: true -- if drop_non_content is true but VLM is disabled,
  # scene mode logs one WARNING and keeps all scenes WITHOUT attempting any VLM/network call (a
  # real incident: with VLM disabled and its endpoint down, an earlier version still made the
  # call unconditionally, burning ~8 minutes of HTTP timeouts before falling back open anyway).
  drop_non_content: false
  # Re-encode codec settings for the per-scene split/concat intermediate passes (re-encoded
  # again by the final whole-video "encode" stage, so this only needs to be visually
  # lossless-ish, not archival quality).
  intermediate_crf: 14
  intermediate_preset: veryfast
  # null (default) = auto: _scene_worker_budget()'s cpu-and-resolution-based heuristic picks how
  # many scenes process concurrently (mem_scale down-weights the CPU-only budget for
  # higher-than-1080p input -- see AGENTS.md's "Scene mode" section for the exact formula). A
  # positive int caps the resulting scene_workers explicitly; the per-scene traditional-
  # interpolation chunk split still derives from the same underlying (uncapped) total budget.
  max_workers: null
  interpolate:
    # Scene-mode-ONLY override for AI/traditional interpolation method selection. null (default)
    # resolves via the EXACT same shared precedence as the standard "interpolate" stage
    # (stages.interpolate.use_ai / general.use_ai / the stage's traditional auto default -- see
    # AGENTS.md's "AI/Traditional Method Selection"), so both paths respond together to the same
    # config. true/false forces AI/traditional for the scene-mode path only, without touching
    # whole-video interpolate behavior.
    use_ai: null
  stabilize:
    # Per-scene stabilize strength tiering. If false, stabilize still runs per-scene (never
    # across a cut) but with stages.stabilize's normal (non-tiered) config for every scene.
    enabled: true
    # avg_shake (px, from StabilizeStage's own vidstabdetect analysis) above which a scene is
    # escalated from "normal" to "aggressive" tier (re-run with smoothness multiplied by
    # aggressive_smoothness_multiplier below). Below stages.stabilize.threshold, a scene is
    # already skipped entirely ("skip" tier) by StabilizeStage's own needs_stab logic.
    aggressive_shake_threshold: 8.0
    aggressive_smoothness_multiplier: 2.0

analysis:
  # Coordinating text-LLM used only when scenes.drop_non_content is true. Reviews ALL per-scene
  # VLM summaries together and returns which scene indices (if any) should be dropped. Can be a
  # cheaper/faster text-only model than analysis.vlm's vision model -- separate provider/model/
  # url/key. Same provider set and the same allow_http/HTTPS gate as analysis.vlm below.
  llm:
    provider: ollama  # ollama, openai, api
    model: llama3
    api_key: ""
    api_url: ""
    allow_http: false
    # Response token budget (max_tokens; Ollama num_predict) for the coordinator call.
    # Reasoning models spend "thinking" tokens from this same budget BEFORE emitting their
    # JSON answer -- if the budget runs out mid-thought the response is truncated and the
    # coordinator fails open (keeps all scenes). If you see "failed open" warnings with a
    # reasoning model, raise this (8192+) or switch to a non-reasoning model.
    max_tokens: 4096

  vlm:
    # Master switch for VLM (Vision Language Model) content analysis. Off by default -- costs
    # API calls / requires a local Ollama instance. The "api" provider has been run end-to-end
    # against a live server; "ollama"/"openai" share the same code path but haven't themselves
    # been independently verified -- see docs/ROADMAP.md's verified/unverified breakdown.
    enabled: false

    # Which backend to call: local, ollama, openai, or api.
    #   local / ollama -- both currently route to the same Ollama-compatible chat endpoint.
    #   openai         -- OpenAI Vision (chat completions with an image), requires api_key.
    #   api            -- any OpenAI-compatible custom endpoint at api_url; requires api_key
    #                      if the endpoint needs auth, refuses non-HTTPS for non-loopback hosts.
    provider: local

    # Model name passed to the provider, e.g. "llava" (Ollama), "gpt-4o" (OpenAI). Also settable
    # per-run with `avf analyze --vlm-model TEXT`.
    model: llava

    # API key for openai/api providers. Leave empty for a local Ollama instance that doesn't
    # require auth. NEVER commit a real key here -- this value is redacted ("***") in the
    # startup settings banner and DEBUG config dumps because the key "api_key" matches
    # config.py's secret-key heuristic, but the config.yaml file on disk is still plaintext.
    # Deliberately config-file-only: there is no `avf analyze` CLI flag for this (or for
    # allow_http below) -- keeping secrets/security posture out of shell history/process args.
    api_key: ""

    # --- Example: local Ollama (default provider) ---
    # provider: ollama
    # model: llava
    # api_url: "http://localhost:11434"   # default if left empty
    # api_key: ""                          # not needed for local Ollama
    #
    # --- Example: OpenAI Vision ---
    # provider: openai
    # model: gpt-4o
    # api_key: "sk-..."                    # required
    # api_url: ""                          # not used by the openai provider
    #
    # --- Example: custom OpenAI-compatible API ---
    # provider: api
    # model: your-vision-model
    # api_url: "https://your-api.example.com/v1/chat/completions"
    # api_key: "..."                       # sent as a Bearer token if non-empty
    #
    # --- Example: llama.cpp / LM Studio / vLLM on a LAN machine (plain HTTP) ---
    # provider: api
    # model: your-vision-model
    # api_url: "http://10.0.1.4:8080/v1/chat/completions"
    # allow_http: true                     # required for non-loopback plain HTTP (see below)

    # Base URL override for ollama/api providers. Empty string = provider-specific default
    # (http://localhost:11434 for ollama). Also settable per-run with
    # `avf analyze --vlm-url TEXT` -- the override still goes through the same allow_http/HTTPS
    # gate below, unchanged.
    api_url: ""

    # The "api" provider refuses plain-HTTP api_url endpoints on non-loopback hosts by
    # default: sampled video frames and the api_key would travel unencrypted. Set true to
    # permit plain HTTP anyway -- only do this for a server on a network you control
    # (e.g. a LAN inference box on a private subnet). HTTPS never needs this. Deliberately
    # config-file-only -- see the api_key note above.
    allow_http: false

    # Response token budget (max_tokens; Ollama num_predict) per VLM call. Raise this if
    # using a reasoning VLM whose thinking tokens count against the response budget.
    max_tokens: 1024

    # Max number of frames sampled from the video and sent to the VLM per analysis call. Also
    # settable per-run with `avf analyze --max-sample-frames INT`.
    max_sample_frames: 8

    # Seconds between sampled frames (see _extract_sample_frames() in core/analysis.py). Also
    # settable per-run with `avf analyze --sample-interval FLOAT`.
    sample_interval_sec: 10.0

    # --- Prompt customization ---
    # The default prompts ask the model to return JSON with keys "summary", "tags",
    # "objects", "rating" (see _VLM_SYSTEM_PROMPT/_VLM_USER_PROMPT in core/analysis.py).
    # _parse_vlm_response() falls back to treating a non-JSON response as the summary
    # (tags/objects empty, rating null), so an override that changes the requested
    # output format degrades gracefully -- you'll still get a summary, just no
    # structured tags/objects/rating.

    # Extra text appended to the user prompt (default or overridden) when non-empty.
    # Use this to give the VLM job-specific context without losing the JSON-output
    # instructions in the default prompt. Also settable per-run with
    # `avf analyze --prompt-append TEXT` (the CLI flag wins over this config value).
    #
    # Example:
    # prompt_append: >
    #   These clips are from a trail camera monitoring a backyard. Focus on identifying
    #   any wildlife species present and note the approximate time of day.
    prompt_append: ""

    # Replaces the default user prompt entirely when non-empty. prompt_append (if set)
    # is still appended after this. Also settable per-run with
    # `avf analyze --prompt-override TEXT` (the CLI flag wins over this config value).
    prompt_override: ""

    # Replaces the default system prompt entirely when non-empty. Config-only, no CLI
    # flag.
    system_prompt_override: ""

  event_detection:
    enabled: true
    # Scene-change sensitivity: consecutive frames are grayscaled, downscaled to
    # 320x180, and compared with mean absolute per-pixel luma difference (normalized
    # to 0-1) -- i.e. "what fraction of the frame's brightness changed, on average,
    # between this frame and the last one". A frame pair scoring ABOVE this value is
    # called a cut. See _detect_scene_changes() in core/analysis.py for the full
    # writeup, including calibration data from a synthetic ground-truth clip (12
    # visually distinct 5s segments: max within-segment score 0.040, min actual-cut
    # score 0.184).
    #   0.05-0.10 -- more sensitive: catches soft/gradual cuts and similar-toned shot
    #                changes, but risks false positives from camera motion, flicker,
    #                or compression noise in busy real footage.
    #   0.15      -- the default; calibrated to catch every cut in the synthetic
    #                ground-truth test with zero false positives, and to catch cuts
    #                that a too-high threshold misses on real footage.
    #   0.3-0.5   -- only hard, high-contrast cuts register; this used to be the
    #                default and under-detected real-world footage (a 3-minute clip
    #                with a cut every 5-7s found only ~5 of ~30 real cuts at 0.3).
    # Also settable per-run with `avf analyze --scene-threshold FLOAT`.
    scene_change_threshold: 0.15
    # Minimum scene duration in seconds. This does NOT affect whether a cut is
    # detected -- only whether a cut that would produce a scene shorter than this
    # gets to start its own scene, versus being absorbed into the following one. For
    # content with legitimately short scenes (fast cuts under ~2s apart), lower this
    # too, or correctly-detected adjacent cuts will still get merged away. Also
    # settable per-run with `avf analyze --min-scene-duration FLOAT`.
    min_scene_duration_sec: 2.0
    # Whether `avf analyze` runs VLM-based classification on each detected scene by default
    # (also toggleable per-invocation with `avf analyze --classify`).
    classify_events: false

  duplicate_detection:
    enabled: true
    # Similarity threshold (0-1) above which two videos are considered duplicates/near-
    # duplicates in find_duplicates()/find_similar().
    similarity_threshold: 0.85
    # No `hash_type` key: as of R5.2, duplicate detection always uses a single pHash
    # (DCT-based perceptual hash) algorithm -- see core/analysis.py's
    # "Perceptual Hashing & Duplicate Detection" section and rust/avf_hashing/ for why
    # this replaced the old ahash/dhash/combined choice.

# REQUIREMENTS.md § 6.4/6.5/6.6: per-video stage/mode summary, media info + timing
# instrumentation, and the structured JSON run report. The per-job classification table (§ 6.4)
# and per-stage duration logging (§ 6.5) always happen regardless of these settings -- the
# three stage_timing_* flags below only add extra cross-video views for correlating stage cost
# with video characteristics, and report_json is the only one that produces a file.
reporting:
  # Print a per-video per-stage duration table (also `avf process --stage-timing-per-video`).
  # Off by default -- the always-on per-job stage table (§ 6.4) already shows duration per
  # stage; this is a focused duration-only view for videos with many stages.
  stage_timing_per_video: false
  # Print per-stage total duration summed across the whole run at the end (also
  # `avf process --stage-timing-totals`). Aggregated by BASE stage name -- an occurrence label
  # like "upscale#2" (a stage repeated via pipeline.default_order) rolls up into "upscale".
  stage_timing_totals: false
  # Print per-stage average duration per video that actually ran it (also
  # `avf process --stage-timing-averages`). The divisor is videos that ran the stage
  # SUCCESSFULLY -- never the total video count: a video that failed at an earlier stage
  # contributes nothing to later stages, and a skipped stage contributes nothing anywhere.
  # Failed stage executions are excluded from both totals and averages and shown in their own
  # "Failed stage executions" section instead (a stage that died in 2s must not drag the
  # average down).
  stage_timing_averages: false
  # Optional path to write a single structured JSON run report to (also
  # `avf process --report-json PATH`). One document per run, written once at the end --
  # including on partial failure (whatever jobs finished). Contains run metadata (avf version,
  # timestamps, effective non-default settings), per-job records (media info, outcome,
  # decision trail, scene stats, timing), and per-stage records within each job (method/
  # fallback provenance, duration, skip reason/error). Deliberately contains NO aggregates
  # (totals/averages) -- those are derivable from the per-job stage records, and storing both
  # invites picking the wrong one during offline analysis. null (default) = don't write one.
  report_json: null

# --- Not part of Config.DEFAULTS, but read elsewhere and worth knowing about ---
#
# encoding:
#   Written by Preset.to_config() (core/presets.py) and merged by Pipeline._apply_config_
#   encoding_overrides() into the "encode" stage's overrides. Not itself in Config.DEFAULTS
#   (so it's absent unless a preset sets it or you add it yourself), but recognized keys are:
#     video_codec: libx264   # remapped to EncodeStage's "codec" kwarg
#     audio_codec: aac
#     crf: 18
#     preset: medium         # encoder speed/quality preset, NOT the same as avf's -p/--preset
#   Overridden per-run by `avf process --codec/--audio-codec/--crf/--encoder-preset`.
