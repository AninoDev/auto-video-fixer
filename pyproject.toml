[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-video-fixer"
version = "0.3.0"
description = "Automated video enhancement and processing suite"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Auto Video Fixer Contributors"},
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "rich>=13.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    # Used on the CORE (non-AI) path by core/stages/stabilize.py's scene-change
    # detection (`from PIL import Image`), and also by
    # ai/backends/ncnn_interpolate.py's RIFE ncnn backend -- declared here
    # (not under an extra) because the stabilize usage runs unconditionally,
    # not only when AI/ncnn extras are installed.
    "pillow>=10.0",
    "avf-scenes",
    "avf-hashing",
    "avf-framepipe",
    "avf-borders",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
ai = [
    "torch>=2.0",
    "torchvision>=0.15",
]
ncnn = [
    # Generic Tencent/ncnn Python bindings, used by ai/backends/ncnn_upscale.py (Real-ESRGAN)
    # and ai/backends/ncnn_common.py. Portable Vulkan inference, no CUDA-matched torch build
    # required.
    "ncnn>=1.0.20221128",
    # RIFE frame interpolation needs a different package: the official RIFE ncnn graph
    # references a custom ncnn layer ("rife.Warp") that the generic `ncnn` package above does
    # not register. rife-ncnn-vulkan-python (https://pypi.org/project/rife-ncnn-vulkan-python/)
    # wraps the actual upstream rife-ncnn-vulkan C++ tool (github.com/K4YT3X/rife-ncnn-vulkan-python)
    # via SWIG, including that custom layer, so it loads/runs correctly -- see
    # ai/backends/ncnn_interpolate.py.
    #
    # As of this writing there is no prebuilt wheel for Python 3.14, so pip/uv builds its sdist
    # from source. That build requires the `swig` system package (e.g. `apt install swig` /
    # `dnf install swig` / `brew install swig`) to be installed *before* running the install.
    # Additionally, the sdist's bundled ncnn snapshot has a stale `cmake_minimum_required()`
    # that modern CMake (>=4) refuses to configure ("Compatibility with CMake < 3.5 has been
    # removed"); work around this by setting CMAKE_POLICY_VERSION_MINIMUM=3.5 in the environment
    # for the install command, e.g.:
    #
    #   CMAKE_POLICY_VERSION_MINIMUM=3.5 uv pip install --no-binary :all: rife-ncnn-vulkan-python
    #
    # (or the equivalent `pip install` invocation). Once installed it does not need to be
    # rebuilt again for the same Python/platform combination.
    "rife-ncnn-vulkan-python>=1.2.1",
]
all = [
    "auto-video-fixer[gui,ai,ncnn]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-qt>=4.2",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
avf = "autovideofixer.cli.cli:main"

[project.gui-scripts]
avf-gui = "autovideofixer.gui.main_window:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/autovideofixer"]

[tool.uv.workspace]
members = [
    "rust/avf_scenes",
    "rust/avf_hashing",
    "rust/avf_framepipe",
    "rust/avf_borders",
]

[tool.uv.sources]
avf-scenes = { workspace = true, editable = true }
avf-hashing = { workspace = true, editable = true }
avf-framepipe = { workspace = true, editable = true }
avf-borders = { workspace = true, editable = true }
