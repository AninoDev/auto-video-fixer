[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "avf_borders"
description = "PyO3/Rust per-edge dominant-color border detection extension for auto-video-fixer (arbitrary-color letterbox/pillarbox, see AGENTS.md Auto-crop section)"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
module-name = "avf_borders"
