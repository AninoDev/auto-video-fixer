[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "avf_hashing"
description = "PyO3/Rust perceptual-hashing (pHash) extension for auto-video-fixer (docs/REQUIREMENTS.md R5.2)"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
module-name = "avf_hashing"
